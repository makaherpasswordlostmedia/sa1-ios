name: iOS armv7 (SA1, iOS 7.0-9.3.5, OpenGL ES 2.0)

# ONE self-contained file: the whole iOS port (backend/ios) is embedded below and unpacked
# into the repo by the first step, so this .yml is the only thing to add.
# ONE self-contained workflow: GitHub -> Actions -> "iOS armv7 (SA1 ...)" -> Run workflow.
# It installs Theos + the iOS toolchain + the iPhoneOS 9.3 SDK, builds
# backend/ios (UIKit / OpenGL ES 2.0 / AudioQueue) together with the recompiled
# game, verifies the Mach-O, and uploads SA1iOS-armv7.ipa and .deb.
#
# The game code is generated from YOUR disc dump and is never committed, so the
# workflow downloads it as a zip of recomp/out (made once on your PC, see
# README-IOS.md):   cd <repo> && zip -qr recomp-out.zip recomp/out
# Upload that zip to Google Drive ("Anyone with the link") and put its file ID in the
# field below, or save it once as the repository secret RECOMP_OUT_ID.
# Without a zip the workflow still compiles the backend (target "backend-only").
#
# This file MUST live at <repo root>/.github/workflows/ on the DEFAULT branch,
# otherwise the "Run workflow" button does not appear.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        type: choice
        default: ipa
        options:
          - ipa             # full app (needs the recomp/out zip)
          - backend-only    # compile-check backend/ios, no game code needed
      recomp_out_id:
        description: "Drive file ID of recomp-out.zip. Empty = secret RECOMP_OUT_ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ios-armv7-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_URL: https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the iOS port (backend/ios + README-IOS.md + tools/ios_build.sh)
