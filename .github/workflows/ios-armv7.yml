      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make python3 python3-pip python3-venv

      - name: Install Theos + iOS toolchain
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL "$TOOLCHAIN_URL" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"

      - name: Install iPhoneOS 9.3 SDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Sn0wCooder/theos-sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          tar -xjf /tmp/theos-sdks/iPhoneOS9.3.sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          # modern clang wants module.modulemap
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done

      - name: Compile-check backend/ios (armv7, iOS 7.0)
        run: |
          set -euo pipefail
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          CC="clang -target armv7-apple-ios7.0 -isysroot $SDK -fno-modules -arch armv7"
          for f in backend/ios/*.c backend/ios/*.m backend/ios/off_full/*.c; do
            $CC -fobjc-arc -std=gnu11 -fsyntax-only -DSA1_COMPACT_RAM=1 -DSA1_OFF_AREA_TEST_ONLY=1 \
              -Irecomp/emitter/runtime -Ihle -Ibackend -Ibackend/ios -Wno-deprecated-declarations "$f"
            echo "ok $f"
          done

      - name: Fetch recomp/out (yours, from Google Drive)
        if: inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        env:
          RECOMP_OUT_ID: ${{ inputs.recomp_out_id || secrets.RECOMP_OUT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RECOMP_OUT_ID:-}" ]; then
            echo "::error::recomp-out.zip missing. Fill recomp_out_id, or set the secret RECOMP_OUT_ID (or run target backend-only)."
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          "$RUNNER_TEMP/venv/bin/gdown" "$RECOMP_OUT_ID" -O "$RUNNER_TEMP/recomp-out.zip"
          unzip -q -o "$RUNNER_TEMP/recomp-out.zip" -d .
          test -f recomp/out/emitter/game_table.c || { echo "::error::zip has no recomp/out/emitter/game_table.c (zip the recomp/out folder, keep the path)"; exit 1; }
          ls recomp/out/emitter | head

      - name: Build .ipa / .deb with Theos
        if: inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        working-directory: backend/ios
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 V=1 2>&1 | tee ../../build-theos.log
          ls -la packages

      - name: Verify Mach-O
        if: inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        working-directory: backend/ios
        run: |
          set -euo pipefail
          BIN="$(find .theos -type f -name SA1iOS | head -n1)"
          file "$BIN" || true
          OTOOL="$(ls "$THEOS"/toolchain/linux/iphone/bin/*otool* 2>/dev/null | head -n1)"
          [ -n "$OTOOL" ] && "$OTOOL" -hv "$BIN" | head -6 || true
          strings "$BIN" | grep -q "ES 2.0 shaders" || { echo "::error::the GLES2 renderer is not in the binary"; exit 1; }
          strings "$BIN" | grep -q "fn_8c010000" || echo "::warning::fn_8c010000 not visible in strings (stripped symbols are fine)"

      - name: Pack .ipa
        if: inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        working-directory: backend/ios
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name SA1iOS.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::SA1iOS.app not found in .theos"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload packages
          cp -a "$APP" ipa/Payload/
          (cd ipa && zip -rq "../packages/SA1iOS-armv7.ipa" Payload)
          ls -la packages

      - uses: actions/upload-artifact@v4
        if: inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        with:
          name: SA1iOS-armv7-iOS7-9
          path: |
            backend/ios/packages/*.ipa
            backend/ios/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && inputs.target != 'backend-only' && github.event_name == 'workflow_dispatch'
        with:
          name: build-logs-armv7
          path: build-theos.log
          if-no-files-found: ignore
